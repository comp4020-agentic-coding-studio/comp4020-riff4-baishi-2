<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>Drift</title>
    <meta
      name="description"
      content="Drift: a browser instrument you play by touch, click or keyboard — eight pentatonic pads, no wrong notes."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Drift</h1>
      <p id="hint" class="hint">Touch, click, or press a key to play. Nothing here can go wrong.</p>
      <div class="instrument" id="instrument" role="group" aria-label="Eight-note pentatonic instrument">
        <button class="pad" type="button" data-freq="261.63" data-note="C4" data-key="a" aria-label="Play C4" style="--hue: 190">
          <span class="keycap" aria-hidden="true">A</span>
        </button>
        <button class="pad" type="button" data-freq="293.66" data-note="D4" data-key="s" aria-label="Play D4" style="--hue: 210">
          <span class="keycap" aria-hidden="true">S</span>
        </button>
        <button class="pad" type="button" data-freq="329.63" data-note="E4" data-key="d" aria-label="Play E4" style="--hue: 230">
          <span class="keycap" aria-hidden="true">D</span>
        </button>
        <button class="pad" type="button" data-freq="391.995" data-note="G4" data-key="f" aria-label="Play G4" style="--hue: 250">
          <span class="keycap" aria-hidden="true">F</span>
        </button>
        <button class="pad" type="button" data-freq="440.00" data-note="A4" data-key="g" aria-label="Play A4" style="--hue: 270">
          <span class="keycap" aria-hidden="true">G</span>
        </button>
        <button class="pad" type="button" data-freq="523.25" data-note="C5" data-key="h" aria-label="Play C5" style="--hue: 290">
          <span class="keycap" aria-hidden="true">H</span>
        </button>
        <button class="pad" type="button" data-freq="587.33" data-note="D5" data-key="j" aria-label="Play D5" style="--hue: 310">
          <span class="keycap" aria-hidden="true">J</span>
        </button>
        <button class="pad" type="button" data-freq="659.26" data-note="E5" data-key="k" aria-label="Play E5" style="--hue: 330">
          <span class="keycap" aria-hidden="true">K</span>
        </button>
      </div>
      <p id="pitch-display" class="pitch-display" aria-live="polite">—</p>
      <button type="button" id="autoplay" class="autoplay" aria-pressed="false">Play melody</button>
      <p class="note">
        Slide across pads to bend between notes. Move up and down to brighten or darken the sound.
      </p>
      <div class="loop-control">
        <button type="button" id="loop-button" aria-pressed="false">
          <span class="loop-dot" aria-hidden="true"></span>
          <span id="loop-label">Record a loop</span>
        </button>
        <span class="keycap" aria-hidden="true">L</span>
      </div>
      <p id="loop-status" class="visually-hidden" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
